<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>TESTE JOGO NOVO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🐹 Jogo da Toupeira</h1>

        <div class="informacoes">

           <p>
    Pontos:
    <span id="pontos">0</span>
</p>

<p>
    Recorde:
    <span id="recorde">0</span>
</p>

            <p>
                Tempo:
                <span id="tempo">30</span>s
            </p>

            <p>
                Vidas:
                <span id="vidas">❤️❤️❤️</span>
            </p>

        </div>

        <button id="botaoComecar">
            Começar
        </button>

        <div class="tabuleiro">

            <div class="buraco" data-id="0"></div>
            <div class="buraco" data-id="1"></div>
            <div class="buraco" data-id="2"></div>

            <div class="buraco" data-id="3"></div>
            <div class="buraco" data-id="4"></div>
            <div class="buraco" data-id="5"></div>

            <div class="buraco" data-id="6"></div>
            <div class="buraco" data-id="7"></div>
            <div class="buraco" data-id="8"></div>

        </div>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
